[package]
name = "sighurt-keymap-modal"
description = "Sighurt's modal keymap: modes and key sequences, vim-style, from the user's own table"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# A keymap needs the keymap API and nothing else (docs/rewrite/extension-api.md, §2.5).
[dependencies]
sighurt-api = { path = "../sighurt-api" }

[dev-dependencies]
# The tests write their tables in TOML, as users do.
toml.workspace = true
