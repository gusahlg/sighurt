[package]
name = "sighurt-ui"
description = "Sighurt's chrome: tab strip and address line, layout, hit testing, text editing, CPU painting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# No sighurt-wayland: the chrome paints into memory the host lends it, so it builds and tests
# without a compositor.
[dependencies]
sighurt-api = { path = "../sighurt-api" }
cosmic-text.workspace = true
tiny-skia.workspace = true
# Grapheme and word boundaries for editing. cosmic-text uses it too.
unicode-segmentation = "1.12"
# Says which font the chrome fell back to when `[ui] font` isn't installed.
log = "0.4"

[dev-dependencies]
# Checks that an address shown decoded parses back to the same URL.
url.workspace = true
