# Public pages the compatibility corpus opens, one at a time, in Servo and in WPE WebKit.
# Each run is a single GET of the URL (and the subresources the page asks for). No logins,
# no form posts, no accounts. Drop a site that has gone rather than pointing it at a parked
# domain. html5test.com shut down; caniuse.com is the feature page in its place.
#
# `id` is the file name of the run's screenshot. `category` is only a label in the report.

[[site]]
id = "example"
url = "https://example.com/"
category = "control"
note = "Plain page. A rendered run should classify as OK."

