<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebGL Animation</title>
<!-- Benchmark workload: WebGL 1, one quad rotating in 3D with per-vertex colors and diffuse
     lighting, redrawn on every requestAnimationFrame. -->
<style>
  body { margin: 0; background: #101216; color: #e8e8ec; font: 16px/1.4 "DejaVu Sans", sans-serif; }
  h1 { margin: 0; padding: 20px 28px; font-size: 28px; background: #553a2b; }
  canvas { display: block; margin: 16px 28px; }
  #error { color: #ff6b6b; margin: 16px 28px; }
</style>
</head>
<body>
<h1>WebGL Animation</h1>
<canvas id="c" width="1200" height="560"></canvas>
<p id="error"></p>
<script>
  const canvas = document.getElementById("c");
  const gl = canvas.getContext("webgl");
  if (!gl) {
    document.getElementById("error").textContent = "WebGL is not available.";
    throw new Error("no webgl");
  }
  const vs = `
    attribute vec3 position;
    attribute vec3 color;
    uniform mat4 rotation;
    uniform float aspect;
    varying vec3 vColor;
    varying float vLight;
    void main() {
      vec4 p = rotation * vec4(position, 1.0);
      // A simple perspective: the camera sits at z = 3 looking at the origin.
      float w = 3.0 - p.z;
      gl_Position = vec4(p.x / aspect, p.y, p.z * 0.1, w * 0.5);
      vec3 normal = (rotation * vec4(0.0, 0.0, 1.0, 0.0)).xyz;
      vLight = 0.25 + 0.75 * abs(dot(normal, normalize(vec3(0.3, 0.5, 1.0))));
      vColor = color;
    }`;
  const fs = `
    precision mediump float;
    varying vec3 vColor;
    varying float vLight;
    void main() { gl_FragColor = vec4(vColor * vLight, 1.0); }`;
  function compile(type, source) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    return shader;
  }
  const program = gl.createProgram();
  gl.attachShader(program, compile(gl.VERTEX_SHADER, vs));
  gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(program);
  gl.useProgram(program);
  // Two triangles: x, y, z, r, g, b.
  const data = new Float32Array([
    -1, -1, 0, 0.95, 0.30, 0.25,   1, -1, 0, 0.25, 0.80, 0.35,   1, 1, 0, 0.25, 0.45, 0.95,
    -1, -1, 0, 0.95, 0.30, 0.25,   1, 1, 0, 0.25, 0.45, 0.95,  -1, 1, 0, 0.95, 0.85, 0.25,
  ]);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, "position");
  const color = gl.getAttribLocation(program, "color");
  gl.enableVertexAttribArray(position);
  gl.enableVertexAttribArray(color);
  gl.vertexAttribPointer(position, 3, gl.FLOAT, false, 24, 0);
  gl.vertexAttribPointer(color, 3, gl.FLOAT, false, 24, 12);
  const rotation = gl.getUniformLocation(program, "rotation");
  gl.uniform1f(gl.getUniformLocation(program, "aspect"), canvas.width / canvas.height);
  gl.viewport(0, 0, canvas.width, canvas.height);
  function frame(now) {
    const a = now / 1000, b = now / 1700;
    const ca = Math.cos(a), sa = Math.sin(a), cb = Math.cos(b), sb = Math.sin(b);
    // Rotation about y by a, then about x by b (column-major).
    gl.uniformMatrix4fv(rotation, false, new Float32Array([
      ca, sa * sb, -sa * cb, 0,
      0, cb, sb, 0,
      sa, -ca * sb, ca * cb, 0,
      0, 0, 0, 1,
    ]));
    gl.clearColor(0.06, 0.07, 0.09, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES, 0, 6);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
