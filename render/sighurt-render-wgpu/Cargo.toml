[package]
name = "sighurt-render-wgpu"
description = "Sighurt's wgpu chrome renderer: wgpu 30 on Vulkan, presenting into the host's native targets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# `WgpuBackend::render_to_image`, for the comparison with the CPU backend.
testing = []

# No sighurt-wayland: the backend binds raw-window-handle handles (RENDER.md §2).
[dependencies]
sighurt-api = { path = "../../crates/sighurt-api" }
sighurt-render = { path = "../sighurt-render", features = ["gpu"] }
raw-window-handle.workspace = true
# Vulkan only, never wgpu's GL backend in sig's process (RENDER.md §14.1).
wgpu = { version = "30", default-features = false, features = ["vulkan", "wgsl"] }
log = "0.4"

# Elsewhere the platform's own API as well, for the headless comparison test (RENDER.md §16):
# Metal on macOS, Direct3D 12 on Windows. Never GL. Linux's dependency set is unchanged.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "wgsl"] }

[dev-dependencies]
sighurt-render-wgpu = { path = ".", features = ["testing"] }
# The standard chrome's fixtures (sighurt-ui's tests/common), for the comparison test.
sighurt-ui = { path = "../../ui/sighurt-ui" }
tiny-skia.workspace = true
# The line chrome's surfaces, for the comparison test.
sighurt-chrome-line = { path = "../../extensions/sighurt-chrome-line" }
