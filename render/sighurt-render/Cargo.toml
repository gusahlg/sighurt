[package]
name = "sighurt-render"
description = "Sighurt's render framework: scenes, the pen chromes draw with, text, glyphs, the Backend trait and the CPU backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# No sighurt-wayland: a backend gets pixel memory or raw-window-handle handles from its
# frontend, never a host type (docs/rewrite/RENDER.md §2).
[features]
# What GPU backends share: meshes, the atlas, the WGSL program (src/gpu).
gpu = ["dep:bytemuck"]

[dependencies]
sighurt-api = { path = "../../crates/sighurt-api" }
cosmic-text.workspace = true
tiny-skia.workspace = true
# What a native backend binds to (`backend::NativeWindow`).
raw-window-handle.workspace = true
# Grapheme boundaries, to cut fitted text whole. cosmic-text uses it too.
unicode-segmentation = "1.12"
# Says which font the chrome fell back to when `[ui] font` isn't installed.
log = "0.4"
# Vertices as bytes, for the GPU backends.
bytemuck = { version = "1.25", features = ["derive"], optional = true }

[dev-dependencies]
# Validates the WGSL program in `cargo test` (wgpu's own naga, so the lock gains nothing).
naga = { version = "30", features = ["wgsl-in"] }
