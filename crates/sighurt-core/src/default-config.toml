# Sighurt configuration.
#
# This is the built-in default, and `sig --default-config` prints it. Your own file is
# ~/.config/sighurt/config.toml. It starts with `version = 1`, the version of this format;
# every other key is optional and keeps the value below when you leave it out. [routing]
# tables merge by engine, field by field, and [engines], [input], [input.buttons], [downloads],
# [session], [commands], [pages.terminal], [pages.config] and [tui] key by key; [keywords], [engines.*],
# [keys], [keymap.*], [ui] and [chrome.*] are yours alone. [tui.keys] in your file is a separate table, over [keys], and
# applies only in the terminal when the keymap is bindings.
#
# The problems in the file are reported together. A file with any problem is not used: at
# startup sig doesn't start, and says which file and what is wrong (these defaults in its place
# would drop what it sets, such as an engine's ephemeral storage or restore = false); when the
# file is loaded again while sig runs, the configuration in use stays. No file at all means
# these defaults at startup; a file deleted or moved away while sig runs leaves the
# configuration in use as it is until the file is back. A table for an engine, keymap or chrome that this build of sig doesn't have is not
# a problem, so one file can serve several builds: sig says so, names what it has, and goes on
# (an absent engine's routing rules are left out, so what they claim opens in the default engine).
# Key bindings, the keymap, the mouse's buttons, scrolling, colors, fonts, the chrome's
# options, the terminal's mode, graphics, frame rate, mouse and keys, the home page, search,
# keywords, zoom, routing, the download folder and session restore apply as soon as they are
# loaded; pages already open stay in the engine they are open in. The chrome and the engines'
# own settings change when sig starts again.

version = 1

# Page shown at startup and in new tabs.
home = "sig://home"

# What the address bar does with text that isn't a URL; `{}` becomes the query.
search = "https://duckduckgo.com/html/?q={}"

# The page zoom new tabs start at and page.zoom-reset returns to: 0.5 to 3, 1.0 being 100 %.
# Tabs already open keep their own.
zoom = 1.0

# Search keywords: when the first word typed into the address bar is one of these, the rest
# goes where its URL has {}, encoded as a search is. A URL without {} opens as it is when its
# keyword is typed alone. A keyword is 1 to 32 lower-case letters, digits and dashes (not
# localhost), so it never hides an address or a path.
#
#   [keywords]
#   w = "https://en.wikipedia.org/w/index.php?search={}"
#   gh = "https://github.com/"

# ── Engines ──────────────────────────────────────────────────────────────────────────────
#
# Engines are compiled into sig: servo (the web), wpe (WPE WebKit, for the sites Servo can't
# show yet), wasm (Sighurt apps) and demo (a test engine), as many of them as the build has.
# Servo stays the web's engine: wpe opens only what [routing.wpe] hosts below gives it and what
# you open with page.open-in wpe.

[engines]
# Opens http and https URLs, and the files and URLs that no routing rule below claims.
# `sig --engine <name>` uses another engine for this run. One the build lacks, or one not
# enabled below, is an error at startup and names the engines available.
default = "servo"
# The engines that may open new pages. Leave it out to allow every engine in the build.
# Pages already open in an engine that you take out stay open until closed.
# enabled = ["servo", "wasm"]

# An engine's own settings are in [engines.<name>], read when sig starts:
#   user-agent: what the engine's requests send and its pages see as the user agent, instead
#     of the engine's own; 1 to 512 printable ASCII characters. servo and wpe honor it.
#   storage: "profile" keeps cookies, site data and caches from one start to the next;
#     "ephemeral" keeps nothing once sig quits. servo, wpe and wasm honor it.
#   experimental-features: true turns on the web-platform preferences Servo marks experimental
#     and leaves off (servoshell's --enable-experimental-web-platform-features). They can be
#     unstable: a page may hang, panic or render wrongly. false, the default, is Servo's own
#     default and does not turn that set on. servo honors it. The set, Servo 0.7 (servoshell
#     commit aac43a3f31a259f04a574f5ec4e959c943ad7cc7), is
#     dom_async_clipboard_enabled, dom_exec_command_enabled, dom_fontface_enabled,
#     dom_indexeddb_enabled, dom_intersection_observer_enabled,
#     dom_navigator_protocol_handlers_enabled, dom_notification_enabled,
#     dom_offscreen_canvas_enabled, dom_permissions_enabled, dom_sanitizer_enabled,
#     dom_storage_manager_api_enabled, dom_webgl2_enabled, dom_webgpu_enabled,
#     layout_columns_enabled, layout_container_queries_enabled,
#     layout_variable_fonts_enabled, layout_css_ellipse_corners_enabled and
#     layout_css_progress_function_enabled.
#     Sighurt already enables some of these (columns, IndexedDB and others; the engine's
#     README names them) because sites need them. Grid (layout_grid_enabled) and
#     IntersectionObserver (dom_intersection_observer_enabled) are on as their own baseline
#     preferences in the engine, not only through this flag. IntersectionObserver stays on
#     (decision 106): github.com freezes without it. On Servo 0.5 it spun reddit.com and
#     microsoft.com (fixed upstream in servo/servo#47693). On Servo 0.7 at 78f1359
#     (louise-pc, 2026-10-22, 3 reps, 30 s after settle) five sites stayed near idle with it
#     on; microsoft.com kept presenting (124 frames against a burst of 33 with it off) at the
#     same CPU, a full core either way. The table is in the Servo engine's SERVO-0.7.md. To
#     turn it off, set dom_intersection_observer_enabled to false in your own file's
#     [engines.servo.preferences].
#     The flag turns the whole set on. It does not enable adopted stylesheets or web
#     animations, and Servo has no preference for requestIdleCallback; set a preference on
#     its own below.
#   preferences: Servo preference names and values, applied after experimental-features, so one
#     feature can be turned on or off on its own. A name is a field of Servo 0.7's Preferences.
#     A value is a boolean, an integer or a string, of that field's type, or four numbers for
#     shell_background_color_rgba. An unknown name or a value of the wrong type is a problem
#     when the file loads. servo honors it.
# Setting what an engine doesn't honor is a problem, never silently ignored.
#
#   [engines.servo]
#   user-agent = "Mozilla/5.0 (X11; Linux x86_64) Sighurt"
#   storage = "ephemeral"
#   experimental-features = true
#
#   [engines.servo.preferences]
#   dom_adoptedstylesheet_enabled = true

# ── Routing ──────────────────────────────────────────────────────────────────────────────
#
# Which engine opens a URL, in this order:
#   1. sig: URLs are Sighurt's own pages (sig://home). Pages can't open them.
#   2. An engine that lists the URL's scheme in `schemes`. http, https, file and sig can't be
#      listed.
#   3. A file: URL whose extension an engine lists in `extensions`.
#   4. An http(s) URL on one of an engine's `origins`, whose extension it lists. This is how a
#      Wasm app opens from a web server.
#   5. An http(s) URL whose host an engine lists in `hosts`: "docs.example.com" is that host
#      (or an IP address), "*.example.com" every host under example.com but not example.com
#      itself (list both for both). The most specific wins: a host before any "*.", a longer
#      "*." before a shorter one. No scheme, port or path.
#   6. The default engine: every other http(s) and file: URL.
# A scheme, an extension or a host belongs to one engine only. An extension only picks the
# engine: the engine checks what it loads, and content it can't show is downloaded or reported.
#
#   [routing.wpe]
#   hosts = ["*.google.com", "google.com"]  # these sites open in WPE WebKit
#
# Links follow the routing too. When you click a link in a page to an address the routing gives
# another engine, the tab opens it there, and back returns to the page; one click moves one
# page. Everything else a page does (a script's redirect, a frame loading, a link opened with
# the keyboard, a form) stays in its engine, even right after your click, and so do all of a
# tab's links after page.open-in chose its engine, until you type an address. Only the address
# goes along. A limit of Servo 0.5 and WebKit, which don't say which frame a link is in: a click
# on a link inside a frame that goes elsewhere moves the whole tab.

[routing.servo]
schemes = ["data", "about"]

[routing.wasm]
extensions = ["wasm"]
# Web servers whose .wasm files are apps, as scheme://host[:port]:
# origins = ["http://localhost:8080"]

# ── Input ────────────────────────────────────────────────────────────────────────────────

[input]
# The keymap that turns key presses into commands. example is Sighurt's default keys, the
# same in the window and the terminal. Its table is in
# extensions/sighurt-config-example/src/table.rs, and the README lists it. bindings reads
# [keys] below and binds nothing until you do. Another keymap compiled into sig reads its
# own table, [keymap.<name>], which its documentation describes.
keymap = "example"
# How far pages scroll for a notch of the wheel or a swipe on the touchpad, as a multiple:
# 0.1 to 10. Scrolling over the chrome is the chrome's own.
scroll-speed = 1.0

# The mouse's side buttons, wherever the pointer is: a command, or "" for none, which leaves
# the button to the page under the pointer.
[input.buttons]
back = "page.back"
forward = "page.forward"

# ── Keys ─────────────────────────────────────────────────────────────────────────────────
#
# The example configuration binds the keys below in both frontends. With keymap = "bindings"
# nothing is bound in either frontend until [keys] binds it, and a [tui.keys] you write
# applies in the terminal only, over [keys]. The tab strip, the toolbar and the address bar
# work without any.
#
# While the page has the keyboard, in both frontends: q quits, o focuses the address line,
# : opens it as the command line (location.focus :), ctrl-o focuses it from anywhere, / opens
# the find field (page.find), n and N move to the next and previous match of the search, t
# opens a tab, x and d close the tab, u reopens the tab closed last, ? and f1 (f1 from the
# address line too) run help, which opens sig://help, J and K move to the next and
# previous tab, H and L go back and forward, r and ctrl-r reload (ctrl-r from anywhere), f11
# toggles fullscreen (from anywhere), e
# reopens the page in the next web engine, j and k scroll, ctrl-d and ctrl-u scroll a page, g
# and G go to the top and the bottom, and + - = zoom. The arrows, pageup, pagedown, home, end,
# space and shift-space are sent to the page to scroll it, and tab, shift-tab and enter to move
# between its links and follow one (space and enter not while a text field of the page has the
# keyboard). Every other key does nothing: this NORMAL mode never types into the page, a text
# field focused or not, and gives it no paste or input method text either.
# alt-1 to alt-9 select those tabs from anywhere. Escape enters INSERT MODE, which shows
# INSERT MODE and gives the page every key, paste and input method text, with no binding
# listening (the "from anywhere" ones neither), until Escape returns to NORMAL; while a page's
# element is fullscreen, Escape leaves that instead and the mode stays. The mouse reaches the
# page in both modes; the address line and the find field take typing in both. y y copies the page's
# address, y f the link the pointer is over, and c o closes the other tabs, highest number
# first. Those three are key sequences of the example configuration, not of [keys]. The
# other tab commands are typed after ":": tab.move left, tab.duplicate, tab.new <address>.
#
# In the terminal only: ctrl-c quits and m switches between text and graphics, both while
# the page has the keyboard, and ctrl-l redraws the page wherever the keyboard is (in NORMAL,
# or while the address line has it). In text mode a field's editor opens only in INSERT.
#
# On sig://terminal (and the addresses under it) and sig://config, which run a program in a
# terminal, INSERT gives Escape to the program like every other key, and ctrl-escape or f12
# leaves it. A terminal with legacy keys, and tmux by default, sends ctrl-escape as a plain
# escape, which then goes to the program: use f12 there. These are bindings of the example
# configuration for those addresses (SITES in its table.rs), not of the browser.
#
#   [keys]                                # everywhere
#   "ctrl-t" = "tab.new"
#   "ctrl-w" = "tab.close"
#   "ctrl-tab" = "tab.next"
#   "ctrl-shift-tab" = "tab.previous"
#   "ctrl-l" = "location.focus"
#   "ctrl-+" = "page.zoom-in"
#   "alt-left" = "page.back"
#   "ctrl-code:KeyQ" = "browser.quit"     # the key where Q is on a US keyboard
#
#   [keys.page]                           # only while the page has focus
#   "f5" = "page.reload"
#   "alt-j" = "page.send-key down"        # scroll as the down arrow does
#
#   [keys.location]                       # only while the address bar has focus
#   "alt-enter" = "page.open https://example.com"
#
#   [keys.url."https://*.example.com"]    # only on these addresses, while the page has focus
#   "ctrl-r" = "page.reload"
#
# [keys.url."<address>"] binds keys for some addresses. The address is "scheme://host" and an
# optional path: "sig://terminal", "https://docs.example.com/guide", or "https://*.example.com"
# for the hosts under example.com (not example.com itself). Its bindings apply while the page
# has the keyboard and the tab shows an address with that scheme and host, case aside, whose
# path starts with that path at a "/": "sig://terminal" is also sig://terminal/config, never
# sig://terminal-x or https://sig/terminal. The address is the one the tab shows, not one
# loading. They win over [keys.page] and [keys]. Of the tables that match, only the most
# specific applies: an exact host before a *., a longer *. before a shorter one, then the
# longer path. At most 64 tables, each address at most 2048 bytes, written as the address has
# it (a non-ASCII host in its xn-- form). A table here adds and overrides bindings; there is no
# way to unbind a key of [keys] for an address.
#
# A keystroke is modifiers and a key, joined by "-". Modifiers: ctrl, alt, shift, super and
# altgr. The key is a character ("t", "+", "å"), a key name (enter, escape, tab, space,
# backspace, delete, insert, home, end, pageup, pagedown, left, right, up, down, menu, f1 to
# f24, or a W3C key name such as BrowserBack), or code: and a W3C key code for a physical key
# ("code:KeyQ", "code:Digit1", "code:BracketLeft").
#
# A character is what the key types in your layout: "ctrl-+" is Ctrl and the key that types
# "+", wherever it is. Shift is part of the character, so Ctrl+Shift+1 is "ctrl-!" on most
# layouts, while a letter keeps its shift: "ctrl-shift-t" and "ctrl-T" are both Ctrl+Shift+T.
# AltGr is never Ctrl+Alt. While you type, in the address bar or a text field of a page, a
# keystroke that types a character (no modifier but shift) types it instead of running its
# command. [keys] has no key sequences such as "g g". The example configuration's y y, y f
# and c o are sequences in its own table.
#
# Commands: tab.new [address], tab.duplicate, tab.move left|right|<n>, tab.reopen,
# tab.close [n], tab.next, tab.previous, tab.select <n>, tab.last, page.open <url>,
# page.open-in <engine> [url], page.switch-engine, page.reload, page.stop, page.back,
# page.forward, page.zoom-in, page.zoom-out, page.zoom-reset, page.send-key <key>,
# page.find [text], page.find-next, page.find-previous, page.find-stop,
# page.exit-fullscreen, clipboard.copy <text>, location.focus [text], history.clear,
# browser.home, browser.fullscreen, browser.quit, site.forget [host], the chrome's own,
# chrome.<action>, and the ones [commands] below defines, such as help. Tabs count from 1.
#
# tab.new opens the home page in a new tab and puts you in the address line; with an address
# it opens that as page.open would (keywords, searches and routing included) and gives the
# page the keyboard. tab.duplicate opens the address shown in a new tab right after it,
# without its history. tab.move left and right move the tab shown one place, wrapping
# around; tab.move <n> moves it to position n. tab.reopen opens the address of the tab
# closed last again, in a new tab at the end, in the engine you chose for it and at its
# zoom; its history and what the page held (a form you filled in, a scroll position) are
# gone. sig keeps the last 10 tabs closed since it started.
#
# location.focus puts you in the address line with the address selected; with text, the line
# holds that text instead, the cursor at its end: "location.focus :" opens the command line.
#
# page.find <text> finds the text (at most 1024 bytes) in the page shown, wrapping around,
# and is case-sensitive only when the text has a capital letter; page.find alone opens the
# chrome's find field, which searches as you type: Enter keeps the search and gives the page
# the keyboard, Escape ends it. page.find-next and page.find-previous move between the matches
# and page.find-stop ends the search; a new page in the tab ends it too. The chrome shows what
# the search found ("3 of 12"). The page's engine searches (Servo and Wasm can't, and say so);
# in the terminal's text mode sig searches the page's text itself.
# history.clear forgets the pages you visited ([history] below). browser.fullscreen puts the
# window in fullscreen, or takes it out (in the window only; the compositor decides), and leaves a
# page's fullscreen with it; page.exit-fullscreen leaves the fullscreen a page put one of its
# elements in (a video, a game). A page gets that only right after a click or key press in
# it, once per click, with a notice saying so; another tab, a new page or the window losing
# the keyboard ends it, and an unmodified Escape the keymap lets through always does. In
# fullscreen the chrome shows only while it has the keyboard, a notice shows, or it draws the
# page (sig://home, errors).
#
# clipboard.copy <text> puts the text on the clipboard. The runtime refuses text over its
# limit and says so, rather than cutting it.
#
# site.forget [host] forgets one site's cookies and stored data in every engine that keeps
# any. With no argument it is the page shown; an argument is that host, and there are no
# wildcards. Each engine reports what it removed, and every tab it is showing of that site
# is reloaded so the page does not store the data again. A sig: page, or a tab with no
# page, shows a notice instead.
#
# page.open-in opens the URL, or the page shown, in the engine named, whatever the routing
# says ("ctrl-alt-w" = "page.open-in servo"); back returns to the page in the engine it was
# in. Nothing of the page comes along but its address.
#
# page.switch-engine reopens the page shown in the next web engine (one that opens http and
# https pages), among those this build has and [engines] enabled allows, wrapping around
# ("ctrl-alt-e" = "page.switch-engine"). It chooses that engine as page.open-in does, so the
# page's links stay until an address is typed. With fewer than two such engines, or a page
# that isn't http, https or a file, it shows a notice and the page stays. The example
# configuration binds it to e in both frontends. With keymap = "bindings" nothing is bound
# until the lines above do.
#
# page.send-key presses and releases a key in the page while the page has the keyboard, as if
# you pressed it: down, up, left, right, pageup, pagedown, home, end, space, enter, escape,
# tab, f1 to f24, or a W3C key name such as BrowserBack, with modifiers ("shift-space"). It
# never types a character. On sig://home, which the chrome draws, the chrome gets it (in the
# terminal, tab moves between home's links and enter follows one). chrome.<action> runs one of the commands of the chrome that draws
# the window; the UI section says which the windowed chrome has, and the Terminal section
# which the terminal's chrome has. In [tui.keys] the commands are the terminal's, in either
# frontend.

# ── Your own commands ────────────────────────────────────────────────────────────────────
#
# [commands] names commands of your own: a word of 1 to 32 lower-case letters, digits and
# dashes, with no dot (and not tab, page, location, history, browser, site, clipboard or
# chrome), that runs one built-in command or a list of up to 8, in order. Keys, the mouse's
# buttons and the command line (":help") run them like built-in ones. They take no argument
# (":help keys" is an error). A command here runs built-in commands only, never another of
# these, and there are at most 64. A bare word that isn't defined here is an unknown command,
# in the file as on the command line. Yours merge with these by name: set one to replace it.
#
#   [commands]
#   wiki = "tab.new https://en.wikipedia.org/"
#   reading = ["page.zoom-reset", "page.zoom-in", "page.zoom-in"]
#
# help opens sig://help, sig's own help, in a new tab; the example configuration binds it to
# ? and f1.

[commands]
help = "tab.new sig://help"

# ── Internal pages ───────────────────────────────────────────────────────────────────────
#
# sig's own pages are Wasm programs built into sig, which the wasm engine runs:
# sig://help (what you need to know, from this build and this file), sig://config (your editor
# on this file, in a terminal on the page) and sig://terminal (a terminal). sig://home is the chrome's own page. Only
# you open them, from the address line, a command or the session; a web page can't, and only
# they reach what they show. They have no network. Without the wasm engine, in the build or
# in [engines] enabled, they don't open. In the terminal they need graphics: they have no
# text mode.

[pages.terminal]
# Whether sig://terminal may run programs. It is a shell with all your rights: the sandbox
# holds the terminal on the page, not the shell. Off, the page says how to turn it on. A
# program starts only when you press a key or click in the page shown, at most one per page
# and 8 at once. It keeps running while its tab is in the background; leaving or reloading the
# page, closing its tab, turning this off or quitting sig ends it (programs the shell puts in
# a process group of their own, or that ignore the hangup, can outlive it, as in any terminal).
enabled = false
# The program sig://terminal runs, with its arguments, without a shell in between; without
# it, $SHELL, or /bin/sh.
# command = "/usr/bin/fish --login"

[pages.config]
# Whether sig://config may run your editor on this file, in a terminal on the page. On by
# default. The editor runs with all your rights, as in any terminal (an editor can run shell
# commands); only the terminal on the page is in the sandbox. Nothing starts until you press
# Enter in the page shown; the rules of [pages.terminal] apply, and the 8 programs at once
# count both pages. When the editor ends, sig reads this file again. Turning this off ends an
# editor that runs.
enabled = true
# The editor, with its arguments, without a shell in between; the file's path is added as its
# last argument. Without it, $VISUAL, then $EDITOR, then the first of nvim, vim, vi and nano
# found on PATH.
# editor = "nvim -u NONE"

# ── Terminal ─────────────────────────────────────────────────────────────────────────────
#
# [tui] is the terminal frontend's. The windowed frontend reads it and does nothing with it,
# so one file serves both. It applies as soon as the file is loaded.
#
# mode: "auto" (the default) follows the terminal, graphics where it can show them and text
# otherwise; "text" is reflowed text; "graphics" is the page's pixels.
# graphics: "auto" (the default) picks kitty where the terminal speaks it, otherwise sixel,
# otherwise text; or "kitty", "sixel", or "none" (text only).
# fps: how many frames of the page graphics mode shows a second, a whole number from 1 to 60.
# The default is 10. Sixel is sent at most 5 a second, whatever this says.
# mouse: whether the terminal's mouse reports clicks and scrolling to the page. The default
# is true.
# default-keys: accepted, and it has no effect since 0.10. The terminal's default keys are
# the example configuration's, in both frontends. A file that sets default-keys gets a
# notice saying so. The key stays so [tui] still merges key by key.
#
#   [tui]
#   mode = "text"
#   graphics = "kitty"
#   fps = 30
#   mouse = false
#   default-keys = false
#
# A [tui.keys] you write applies only in the terminal, over [keys], when the keymap is
# bindings. It does not apply in the window. [tui.keys.page], [tui.keys.location] and
# [tui.keys.url."<address>"] are the same contexts as [keys.page], [keys.location] and
# [keys.url."<address>"], and like every [tui.keys] binding win over all of [keys]. A keystroke that types a character
# (no modifier but shift) does not run while you type in a text field of the page or in the
# terminal's line, the same as in [keys]. A ctrl- or alt- binding still runs.
#
# The terminal's chrome commands, chrome.<action>, are chrome.toggle-mode (text or graphics),
# chrome.text-mode, chrome.graphics-mode and chrome.refresh (draw the page again).
#
#   [tui.keys]
#   "m" = "chrome.toggle-mode"
#   [tui.keys.page]
#   "r" = "page.reload"

[tui]
mode = "auto"
graphics = "auto"
fps = 10
mouse = true
default-keys = true

# ── UI ───────────────────────────────────────────────────────────────────────────────────
#
# [ui] holds what every chrome shares. `chrome` is the chrome that draws the window, one
# compiled into sig ("standard" is in every build); it changes when sig starts again. A
# chrome's own options are in [chrome.<name>], and its own commands are chrome.<action>,
# which take no argument: the standard chrome's is chrome.toggle-tabs, which hides and shows
# its tabs.
#
# `renderer` is what draws the chrome: "cpu" (in every build), "wgpu" (the GPU through
# Vulkan, in a default sig), "vulkan" (Vulkan directly, in a sig built with render-vulkan),
# or "auto", which chooses (the CPU until a GPU renderer is measured at least as good). One
# this sig lacks or that can't start gives a notice and auto is used; a GPU that can't
# present the chrome's surfaces, or fails later, gives the chrome back to the CPU. It
# changes when sig starts again.
#
#   [ui]
#   chrome = "standard"
#   renderer = "auto"
#   font = "DejaVu Sans"    # the chrome's text; one that isn't installed falls back
#   font-size = 14          # 9 to 32 logical pixels; the chrome's heights follow it
#
# The standard chrome's options, in [chrome.standard], the default first: tabs = "top",
# "left" (a list beside the page) or "hidden"; status = "strip" (below the page) or "overlay"
# (over the page's bottom-left corner, only while there is something to say); buttons = true
# or false (back, forward and reload before the address); compact = false or true (a lower tab
# strip and toolbar); engine-label = true or false (the engine a page runs in, such as servo or
# wpe, in small muted text in its tab and at the address bar's right end; sig: pages have
# none). They apply as soon as they are loaded.
#
# A sig built with the chrome-line feature has line: the whole chrome is one line, showing the
# tab's place ([2/5]), the keymap's mode, the address and the status; tabs are reached by keys
# and commands, and it has no commands of its own. Its options, in [chrome.line]: position =
# "top" or "bottom"; engine-label = true or false (the page's engine at the line's end).
#
# The colors, each "#rrggbb" or "#rrggbbaa"; leave one out to keep its default:
#
#   [ui.colors]
#   bg = "#0a0a0b"          # window and page background
#   surface = "#18181b"     # address bar and the home page's card
#   hover = "#27272a"       # buttons under the pointer
#   tab = "#27272a"         # the selected tab
#   border = "#27272a"      # lines between areas
#   focus = "#d4d4d8"       # border of the focused address bar
#   text = "#fafafa"
#   text_muted = "#a1a1aa"  # secondary text and icons
#   text_dim = "#71717a"    # hints and disabled buttons
#   selection = "#60a5fa55" # selected text in the address bar
#   error = "#dc2626"       # error messages

# ── Files ────────────────────────────────────────────────────────────────────────────────
#
# Downloads go to the desktop's download folder (XDG_DOWNLOAD_DIR in ~/.config/user-dirs.dirs),
# or ~/Downloads if there is none, unless `directory` names another: an absolute path, or one
# starting with ~/. Web pages and Wasm apps alike save there, at most one file a second per tab
# and 8 at once in all. A folder that doesn't exist yet is made at the first download.
#
#   [downloads]
#   directory = "~/Downloads"

[session]
# Whether sig opens the tabs it had when it last quit, and saves them as they change, in
# ~/.local/state/sighurt/session.toml. With false it starts with the home page and doesn't
# write the session file, which it leaves as it is. With storage = "ephemeral" for each engine
# too, nothing of a session is kept. One sig saves the session: another started while it runs
# restores the same tabs but doesn't save its own, and says so. A session file sig can't read is
# kept as session.toml.broken-<seconds>, never written over; a damaged tab in it is left out.
# sig holds at most 1000 tabs.
restore = true

[history]
# Whether sig records the pages you visit, to complete what you type in the address line, and
# saves them in ~/.local/state/sighurt/history.toml (mode 0600): each page's address (without
# its #fragment), its title, when you last visited it and how often. Only http and https pages
# you open in the tab shown are recorded: not sig:, file: or data: pages, not addresses with a
# user name or password in them, not pages of an engine with storage = "ephemeral", not
# reloads or back and forward, and nothing sig --dump shows. sig keeps the 5000 visited last
# and forgets visits older than 90 days when it starts; it writes the file at most every 30
# seconds, and at quit. With false nothing is recorded, what was loaded is dropped at once, and
# the file is left as it is. history.clear empties the file, and site.forget <host> takes that
# site's pages out of it, at once, with remember on or off; a history file sig couldn't read,
# kept as history.toml.broken-<seconds>, is not emptied. As with the session, one sig saves
# the history: another started while it runs completes from it but doesn't save its own, and
# what it forgets is forgotten in it only. The history, the session (above) and each engine's
# storage are separate: to keep nothing, set remember = false and restore = false here, and
# storage = "ephemeral" for each engine.
remember = true
