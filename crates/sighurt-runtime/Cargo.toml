[package]
name = "sighurt-runtime"
description = "Sighurt's frontend-neutral runtime: the engine registry, effects, services and the session driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# No engines by default: a frontend (today, sighurt-gui) enables the ones it binds.
default = []
# Gates the registry's variant and the engine's descriptor (its name, capabilities and the
# settings of `[engines.<name>]` it honors). Servo, Wasm and WPE are also depended on here
# for that and for the configuration their runtimes start with (`servo_config` and the rest).
# For Servo, the logger flag lives here and the call to `setup_logging` in the frontend that
# constructs the runtime. The demo engine's concrete type never appears here: its descriptor
# is the name `demo` and no capabilities, so this crate does not depend on it.
engine-servo = ["dep:sighurt-engine-servo"]
engine-wasm = ["dep:sighurt-engine-wasm"]
engine-wpe = ["dep:sighurt-engine-wpe"]
engine-ladybird = ["dep:sighurt-engine-ladybird"]
# Chromium (docs/rewrite/CEF.md). Opt-in: its prefix is 2.8 GB.
engine-cef = ["dep:sighurt-engine-cef"]
engine-demo = []
# NetSurf. Off unless a frontend asks. The descriptor is the only NetSurf-specific
# code in this crate (docs/rewrite/NETSURF.md).
engine-netsurf = ["dep:sighurt-engine-netsurf"]
# Chromes are the frontend's. The feature exists so one `--features` list can name every
# crate of the `sig` split; it changes nothing here.
chrome-line = []

[dependencies]
sighurt-api = { path = "../sighurt-api" }
sighurt-core = { path = "../sighurt-core" }
sighurt-engine-servo = { path = "../../engines/sighurt-engine-servo", optional = true }
sighurt-engine-wasm = { path = "../../engines/sighurt-engine-wasm", optional = true }
sighurt-engine-wpe = { path = "../../engines/sighurt-engine-wpe", optional = true }
sighurt-engine-ladybird = { path = "../../engines/sighurt-engine-ladybird", optional = true }
sighurt-engine-netsurf = { path = "../../engines/sighurt-engine-netsurf", optional = true }
sighurt-engine-cef = { path = "../../engines/sighurt-engine-cef", optional = true }
# The example configuration, the built-in keymap of every build (docs/rewrite/config-extension.md).
sighurt-config-example = { path = "../../extensions/sighurt-config-example" }
# The configuration watch (inotify) and CLOCK_MONOTONIC for the diagnostics lines.
rustix = { workspace = true, features = ["fs"] }
# `_exit` after an engine that could not shut down (decision 54).
libc = "0.2"
dirs = "5"
serde.workspace = true
serde_json = "1"
url.workspace = true
percent-encoding = "2"
log = "0.4"
env_logger = "0.11"
# Downloads, with the features the Wasm engine uses, so both share one build of it.
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "stream"], default-features = false }
# The directory of what `storage = "ephemeral"` keeps while the process runs.
tempfile = "3"
