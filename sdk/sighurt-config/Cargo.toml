[package]
name = "sighurt-config"
description = "What a Sighurt configuration is written against: the experience (keys, modes, sequences, custom actions) as data, and the default experience built with it"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# This crate's own source is Apache-2.0. It depends on and re-exports sighurt-api, which is
# AGPL-3.0-or-later, so a configuration built with it today is combined with AGPL code and
# compiled into sig: the Apache licence here does not let such a configuration be distributed on
# other terms. A permissively licensed data crate, with configurations loaded as separate
# modules, is planned (docs/rewrite/experience-2026-11-15.md, §2).
license = "Apache-2.0"
authors.workspace = true

# A configuration needs the keymap data and the command vocabulary, nothing else
# (docs/rewrite/experience-2026-11-15.md, §2).
[dependencies]
sighurt-api = { path = "../../crates/sighurt-api" }
