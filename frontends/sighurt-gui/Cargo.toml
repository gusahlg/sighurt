[package]
name = "sighurt-gui"
description = "Sighurt's Wayland frontend: the owner loop, the chrome and engine presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Each engine feature enables that engine's runtime in sighurt-runtime (its configuration and
# the registry variant) and the crate that constructs the runtime bound to Wayland targets.
engine-servo = ["sighurt-runtime/engine-servo", "dep:sighurt-engine-servo"]
engine-wasm = ["sighurt-runtime/engine-wasm", "dep:sighurt-engine-wasm"]
engine-wpe = ["sighurt-runtime/engine-wpe", "dep:sighurt-engine-wpe"]
engine-ladybird = ["sighurt-runtime/engine-ladybird", "dep:sighurt-engine-ladybird"]
engine-cef = ["sighurt-runtime/engine-cef", "dep:sighurt-engine-cef"]
engine-demo = ["sighurt-runtime/engine-demo", "dep:sighurt-engine-demo"]
engine-netsurf = ["sighurt-runtime/engine-netsurf", "dep:sighurt-engine-netsurf"]
# Chromes besides sighurt-ui's `standard`, chosen by `[ui] chrome`.
chrome-line = ["dep:sighurt-chrome-line"]
# The chrome's GPU renderer, chosen by `[ui] renderer = "wgpu"` (docs/rewrite/RENDER.md).
render-wgpu = ["dep:sighurt-render-wgpu"]
# The chrome's Vulkan renderer on ash, chosen by `[ui] renderer = "vulkan"`; opt-in.
render-vulkan = ["dep:sighurt-render-vulkan"]

[dependencies]
sighurt-api = { path = "../../crates/sighurt-api" }
sighurt-core = { path = "../../crates/sighurt-core" }
sighurt-wayland = { path = "../sighurt-wayland" }
sighurt-ui = { path = "../../ui/sighurt-ui" }
# The chrome's renderers (`[ui] renderer`): the CPU one in every build.
sighurt-render = { path = "../../render/sighurt-render" }
sighurt-render-wgpu = { path = "../../render/sighurt-render-wgpu", optional = true }
sighurt-render-vulkan = { path = "../../render/sighurt-render-vulkan", optional = true }
sighurt-runtime = { path = "../../crates/sighurt-runtime" }
sighurt-engine-servo = { path = "../../engines/sighurt-engine-servo", optional = true }
sighurt-engine-wasm = { path = "../../engines/sighurt-engine-wasm", optional = true }
sighurt-engine-wpe = { path = "../../engines/sighurt-engine-wpe", optional = true }
sighurt-engine-ladybird = { path = "../../engines/sighurt-engine-ladybird", optional = true }
sighurt-engine-cef = { path = "../../engines/sighurt-engine-cef", optional = true }
sighurt-engine-demo = { path = "../../engines/sighurt-engine-demo", optional = true }
sighurt-engine-netsurf = { path = "../../engines/sighurt-engine-netsurf", optional = true }
sighurt-chrome-line = { path = "../../extensions/sighurt-chrome-line", optional = true }
# The owner loop.
calloop.workspace = true
# The signal pipe.
rustix.workspace = true
libc = "0.2"
log = "0.4"
