[package]
name = "sighurt-tui"
description = "Sighurt's terminal frontend: pages as kitty graphics or as text, in the terminal `sig` runs in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
# No engines by default: `sig` forwards the ones it is built with (its `frontend-tui`), and the
# terminal binds each to its CPU target (src/engines.rs).
default = []
engine-servo = ["sighurt-runtime/engine-servo", "dep:sighurt-engine-servo"]
engine-wasm = ["sighurt-runtime/engine-wasm", "dep:sighurt-engine-wasm"]
# WebKit presents into the terminal's CPU target: shared-memory frames, one copy each.
engine-wpe = ["sighurt-runtime/engine-wpe", "dep:sighurt-engine-wpe"]
engine-demo = ["sighurt-runtime/engine-demo", "dep:sighurt-engine-demo"]
engine-netsurf = ["sighurt-runtime/engine-netsurf", "dep:sighurt-engine-netsurf"]
keymap-modal = ["sighurt-runtime/keymap-modal"]

[dependencies]
sighurt-api = { path = "../../crates/sighurt-api" }
sighurt-core = { path = "../../crates/sighurt-core" }
sighurt-runtime = { path = "../../crates/sighurt-runtime", default-features = false }
sighurt-engine-servo = { path = "../../engines/sighurt-engine-servo", optional = true }
sighurt-engine-wpe = { path = "../../engines/sighurt-engine-wpe", optional = true }
sighurt-engine-wasm = { path = "../../engines/sighurt-engine-wasm", optional = true }
sighurt-engine-demo = { path = "../../engines/sighurt-engine-demo", optional = true }
sighurt-engine-netsurf = { path = "../../engines/sighurt-engine-netsurf", optional = true }
base64 = "0.22"
calloop.workspace = true
dirs = "5"
flate2 = "1.1"
libc = "0.2"
log = "0.4"
rustix = { workspace = true, features = ["event", "fs", "process", "pty", "stdio", "termios"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[[bin]]
name = "sighurt-tui-worker"
path = "src/bin/worker.rs"
