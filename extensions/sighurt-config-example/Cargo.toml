[package]
name = "sighurt-config-example"
description = "The configuration compiled into Sighurt: the default experience, and how to change it in Rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# A configuration needs the SDK and nothing else (docs/rewrite/experience-2026-11-15.md, §2).
[dependencies]
sighurt-config = { path = "../../sdk/sighurt-config" }

# Its tests drive the experience on the core's key engine.
[dev-dependencies]
sighurt-api = { path = "../../crates/sighurt-api" }
sighurt-core = { path = "../../crates/sighurt-core" }
