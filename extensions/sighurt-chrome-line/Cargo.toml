[package]
name = "sighurt-chrome-line"
description = "A one-line chrome for Sighurt, built on the chrome API alone"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# Only the chrome API: nothing of the core, the host or an engine.
[dependencies]
sighurt-api = { path = "../../crates/sighurt-api" }
sighurt-ui = { path = "../../ui/sighurt-ui" }

[dev-dependencies]
# Reads and writes the golden images.
tiny-skia.workspace = true
