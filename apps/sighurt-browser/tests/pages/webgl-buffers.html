<!doctype html><title>webgl-buffers</title>
<body>webgl buffer churn
<script>
// Regression page: buffers deleted while attached to VAOs, attributes and the
// element array binding, then the VAO deleted, then GC. Servo 0.7 panicked
// (webglbuffer.rs: is_deleted assert, refcount underflow) on such sequences.
function churn(gl, vao) {
  for (let i = 0; i < 300; i++) {
    const v = vao.create(), a = gl.createBuffer(), e = gl.createBuffer();
    vao.bind(v);
    gl.bindBuffer(gl.ARRAY_BUFFER, a);
    gl.bufferData(gl.ARRAY_BUFFER, 48, gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, e);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, e);
    if (i % 2) gl.deleteBuffer(a);
    vao.bind(null);
    gl.deleteBuffer(a); gl.deleteBuffer(e);
    vao.bind(v);
    gl.bindBuffer(gl.ARRAY_BUFFER, null);
    gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 0, 0);
    gl.drawBuffers && 0;
    vao.bind(null);
    vao.del(v);
    vao.del(v);
  }
}
let n = 0;
for (const name of ['webgl2', 'webgl']) {
  const gl = document.createElement('canvas').getContext(name);
  if (!gl) continue;
  n++;
  if (name == 'webgl2') {
    churn(gl, { create: () => gl.createVertexArray(), bind: v => gl.bindVertexArray(v), del: v => gl.deleteVertexArray(v) });
  } else {
    const x = gl.getExtension('OES_vertex_array_object');
    if (x) churn(gl, { create: () => x.createVertexArrayOES(), bind: v => x.bindVertexArrayOES(v), del: v => x.deleteVertexArrayOES(v) });
  }
}
document.title = 'webgl-buffers done ' + n;
document.body.append(' done ' + n);
</script>
