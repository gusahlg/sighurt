[package]
name = "sighurt-browser"
description = "Sighurt, a small Wayland browser with compiled-in content engines: the `sig` executable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "sig"
path = "src/main.rs"

[features]
# The engines compiled into `sig`: this line is the list. Edit it to choose the engines of a
# default build; `--no-default-features --features engine-demo` picks them for one build.
# Which compiled engines may open pages is runtime configuration. WPE WebKit needs the prefix
# nix/build-wpewebkit.sh installs (docs/rewrite/WPE.md); without it, build with
# `--no-default-features --features engine-servo,engine-wasm`.
default = ["frontend-gui", "frontend-tui", "engine-servo", "engine-wasm", "engine-wpe"]
# Empty, and not what enables the GUI. `--no-default-features` is a GUI with no engines, and
# the headless builds name engine features without this one, so sighurt-gui is an unconditional
# dependency: an empty feature cannot both enable an optional dependency and stay on when
# default features are off.
frontend-gui = []
# The terminal frontend. Off in the headless GUI builds, which name engine features only.
frontend-tui = ["dep:sighurt-tui"]
engine-servo = ["sighurt-gui/engine-servo", "sighurt-tui?/engine-servo", "dep:sighurt-engine-servo"]
engine-wasm = ["sighurt-gui/engine-wasm", "sighurt-tui?/engine-wasm"]
engine-wpe = ["sighurt-gui/engine-wpe", "sighurt-tui?/engine-wpe"]
engine-demo = ["sighurt-gui/engine-demo", "sighurt-tui?/engine-demo"]
# Keymaps besides the core's own `bindings`, chosen by `[input] keymap`.
keymap-modal = ["sighurt-gui/keymap-modal", "sighurt-tui?/keymap-modal"]
# Chromes besides sighurt-ui's `standard`, chosen by `[ui] chrome`.
chrome-line = ["sighurt-gui/chrome-line"]

[dependencies]
sighurt-core = { path = "../../crates/sighurt-core" }
# The Wayland frontend. Not optional: see `frontend-gui` above.
sighurt-gui = { path = "../../frontends/sighurt-gui" }
# The terminal frontend. Optional: the headless GUI builds leave `frontend-tui` off.
sighurt-tui = { path = "../../frontends/sighurt-tui", optional = true, default-features = false }
# The panic hook asks Servo whether it caught the panic (decision 26). Linking the engine
# itself is sighurt-gui's.
sighurt-engine-servo = { path = "../../engines/sighurt-engine-servo", optional = true }
# The self-pipe for signals.
rustix.workspace = true
# SIGUSR1 (diagnostics), SIGTERM and SIGINT (a clean quit), each handled by writing to a pipe.
signal-hook-registry = "1.4"
libc = "0.2"
log = "0.4"
# `sig` installs the TLS provider before anything builds a TLS configuration (decision 26).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# `sig --tui` in a pty, with a fake terminal on the other side (tests/tui.rs).
[[test]]
name = "tui"
required-features = ["frontend-tui", "engine-demo"]

[dev-dependencies]
# The argument tests' temporary files.
tempfile = "3"
# The `virtual-pointer` example, a test helper that keeps one pointer plugged into a private
# compositor.
wayland-client.workspace = true
smithay-client-toolkit.workspace = true
