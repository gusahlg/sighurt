[package]
name = "sighurt-tui"
description = "Sighurt's terminal frontend: pages as kitty graphics or as text, in the terminal `sig` runs in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
sighurt-api = { path = "../sighurt-api" }
base64 = "0.22"
calloop.workspace = true
flate2 = "1.1"
libc = "0.2"
rustix = { workspace = true, features = ["event", "fs", "process", "pty", "stdio", "termios"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[[bin]]
name = "sighurt-tui-worker"
path = "src/bin/worker.rs"
