[package]
name = "sighurt-semantic"
description = "DOM extraction script and bounded parser shared by Sighurt's Servo and WPE adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

# The script's JSON is page data. serde_json is already in the workspace graph (the runtime and
# the Wasm engine); this crate does not add a new third-party crate beyond that.
[dependencies]
sighurt-api = { path = "../sighurt-api" }
serde_json = "1"
