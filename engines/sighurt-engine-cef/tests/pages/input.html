<!doctype html>
<meta charset="utf-8">
<title>input</title>
<body style="margin:0;background:#fff">
<input id="field" style="position:absolute;left:20px;top:20px;width:300px;height:30px;font-size:20px">
<a id="blank" href="second.html" target="_blank" style="position:absolute;left:20px;top:100px;font:20px sans-serif">new tab</a>
<a id="same" href="second.html" style="position:absolute;left:20px;top:150px;font:20px sans-serif">same tab</a>
<script>
  const field = document.getElementById('field');
  field.addEventListener('input', () => { document.title = 'typed:' + field.value; });
  document.getElementById('field').addEventListener('keydown', e => { if (e.key === 'Enter') document.title = 'enter:' + field.value; });
</script>
