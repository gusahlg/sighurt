[package]
name = "sighurt-engine-cef"
description = "The CEF (Chromium) engine for Sighurt: Chromium's windowless rendering, frames presented on CPU targets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
# CEF comes from the prefix nix/build-cef.sh installs (docs/rewrite/CEF.md), opened with dlopen
# when the runtime first starts (src/ffi.rs), never linked.

[dependencies]
sighurt-api = { path = "../../crates/sighurt-api" }
# Origins of committed pages, for service requests.
url.workspace = true
libc = "0.2"
# Warnings through the executable's logger.
log = "0.4"
