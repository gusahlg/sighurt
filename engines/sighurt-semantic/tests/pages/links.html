<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Links</title>
  <base href="https://example.com/dir/page.html">
</head>
<body>
  <!-- hrefs should be absolute against the base. The anchor with no href is not a link. -->
  <p>See <a href="/abs">the absolute path</a> and <a href="rel">a relative one</a>.</p>
  <p><a href="https://other.example/x">Other host</a></p>
  <p><a href="mailto:ada@example.com">Mail</a></p>
  <p><a>No href</a></p>
  <p><a href="image.html"><img src="dot.png" alt="A dot"></a></p>
</body>
</html>
