<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Headings</title>
</head>
<body>
  <!-- Headings 1–6, a paragraph whose whitespace should collapse, a line break, and inline emphasis. -->
  <h1>Title</h1>
  <h2>Section</h2>
  <h3>Subsection</h3>
  <h4>Detail</h4>
  <h5>Minor</h5>
  <h6>Smallest</h6>
  <p>  hello   <em>world</em>  </p>
  <p>line<br>break</p>
  <h2 aria-level="3">Promoted heading</h2>
</body>
</html>
