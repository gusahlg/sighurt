<!DOCTYPE html>
<meta charset="utf-8">
<title>password</title>
<!-- A focused password field; the title says how long its value is, never the value. -->
<input id="field" type="password" autofocus>
<script>
  addEventListener("load", () => field.focus());
  field.addEventListener("input", () => { document.title = `password ${field.value.length}`; });
</script>
