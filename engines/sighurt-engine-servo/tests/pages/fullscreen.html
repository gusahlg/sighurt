<!DOCTYPE html>
<meta charset="utf-8">
<title>normal</title>
<!-- Element fullscreen: a click anywhere asks for it; the title says the state. With ?auto the
     page asks at load, with no user activation. -->
<style>html, body { margin: 0; height: 100%; } button { position: fixed; inset: 0; width: 100%; height: 100%; font: 24px sans-serif; }</style>
<button id="go">fullscreen</button>
<script>
  const ask = () => document.documentElement.requestFullscreen().catch(() => document.title = "refused");
  document.getElementById("go").onclick = ask;
  document.onfullscreenchange = () => document.title = document.fullscreenElement ? "full" : "normal";
  if (location.search == "?auto") addEventListener("load", ask);
</script>
