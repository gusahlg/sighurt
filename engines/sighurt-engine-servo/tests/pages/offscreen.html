<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>offscreen</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1b4f72;
}
.top {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 48px;
  background: #e67e22;
}
.box {
  position: absolute;
  left: 80px;
  top: 80px;
  width: 48px;
  height: 48px;
}
.mark {
  position: fixed;
  right: 0;
  bottom: 0;
  width: 24px;
  height: 24px;
  background: #ff00ff;
}
</style>
</head>
<body>
<div class="top"></div>
<canvas class="box" width="48" height="48"></canvas>
<script>
// The box is WebGL, cleared green: its surface reaches the offscreen context as a texture.
var gl = document.querySelector(".box").getContext("webgl", { preserveDrawingBuffer: true });
gl.clearColor(0, 1, 0, 1);
gl.clear(gl.COLOR_BUFFER_BIT);
</script>
<div class="mark"></div>
</body>
</html>
