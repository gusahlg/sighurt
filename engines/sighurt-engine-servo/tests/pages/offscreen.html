<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>offscreen</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1b4f72;
}
.top {
  position: absolute;
  left: 0;
  top: 0;
  width: 100%;
  height: 48px;
  background: #e67e22;
}
.box {
  position: absolute;
  left: 80px;
  top: 80px;
  width: 48px;
  height: 48px;
  background: #00ff00;
}
.mark {
  position: fixed;
  right: 0;
  bottom: 0;
  width: 24px;
  height: 24px;
  background: #ff00ff;
}
</style>
</head>
<body>
<div class="top"></div>
<div class="box"></div>
<div class="mark"></div>
</body>
</html>
