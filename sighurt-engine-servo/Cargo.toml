[package]
name = "sighurt-engine-servo"
description = "Servo (HTML/CSS/JavaScript) content engine for Sighurt, compiled into sig"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
# Source files adapted from Servo stay under Servo's MPL-2.0 and keep their MPL notices; the
# rest of the crate is AGPL-3.0-or-later. Servo itself is MPL-2.0. See NOTICE.
license = "AGPL-3.0-or-later AND MPL-2.0"

[dependencies]
sighurt-api = { path = "../sighurt-api" }
sighurt-wayland = { path = "../sighurt-wayland" }
# Pinned at 0.7, with `webgl` (optional and off by default in that release). Code against the
# 0.7 sources, not a newer upstream.
servo.workspace = true
surfman.workspace = true
raw-window-handle.workspace = true
url.workspace = true
# Types in Servo 0.7's `RenderingContext` trait and WebView API, at the versions Servo uses.
dpi = "0.1"
euclid = "0.22"
gleam = "0.15"
glow = "0.17"
# dlopen/dlsym for the EGL calls surfman doesn't offer (swap interval, eglTerminate).
libc = "0.2"
# The process's logger is Servo's (installed by the executable); diagnostics go through it.
log = "0.4"

[dev-dependencies]
calloop.workspace = true
# `ServoTestUtils.panic()` for the page-crash test (with `dom_servo_helpers_enabled`), as
# m0-coexist uses it. Test and example builds only: `sig` never gets it.
servo = { workspace = true, features = ["testbinding"] }
# The example and the tests play the executable, which installs the TLS provider (M0).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

# Ends with Servo left running, which only a process exit without exit handlers survives (as
# `sig`'s must): its own `main`.
[[test]]
name = "crash"
harness = false
