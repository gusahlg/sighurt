[package]
name = "wpe-cpu"
description = "Phase 0b: WPE WebKit rendering to shared memory with no compositor (docs/rewrite/TUI.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sighurt-api = { path = "../../crates/sighurt-api" }
# The engine's public WPE platform (`Display::new(None)`), GLib loop and `ffi`. This binary never
# opens Wayland; the engine crate links the client library because its presenter does.
sighurt-engine-wpe = { path = "../../engines/sighurt-engine-wpe" }
glib = "0.22"
