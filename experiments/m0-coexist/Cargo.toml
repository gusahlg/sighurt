[package]
name = "m0-coexist"
description = "Milestone M0: Servo and Wasmtime initialized and used in one process (docs/rewrite/M0.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish = false

[dependencies]
# `testbinding` compiles `ServoTestUtils` (exposed only with the `dom_servo_helpers_enabled`
# preference), whose `panic()` panics on the calling page's script thread (step 9). Only this
# experiment builds Servo with it.
servo = { workspace = true, features = ["testbinding"] }
wasmtime.workspace = true
url.workspace = true
# The Wasm engine itself, mounted as `sig` mounts it, so that every native library it links
# (FFmpeg, ALSA, OpenSSL, libudev, v4l, WebRTC, ...) links into this executable too.
sighurt-engine-wasm = { path = "../../engines/sighurt-engine-wasm" }
sighurt-api = { path = "../../crates/sighurt-api" }
# Versions Servo 0.7 itself uses, for its rendering context and GL diagnostics.
dpi = "0.1"
gleam = "0.15"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
wat = "1"
libc = "0.2"
log = "0.4"
# Libraries of the Wasm engine that step 2 initializes directly, with the engine's version
# requirements (Cargo resolves each to the engine's own copy).
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["rustls-tls", "blocking", "stream"], default-features = false }
ffmpeg-next = "8.1.0"
rodio = "0.22.2"
cpal = "0.17.3"
