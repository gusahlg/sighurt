[package]
name = "wpe-engine"
description = "WPE WebKit as an in-process Sighurt engine: the WPE equivalent of M0/M1 (docs/rewrite/WPE.md)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
sighurt-api = { path = "../../sighurt-api" }
sighurt-wayland = { path = "../../sighurt-wayland" }
# The host's own wl_display, through a second event queue for the page's DMA-BUF buffers.
wayland-client.workspace = true
wayland-protocols.workspace = true
calloop.workspace = true
# The target's raw display and surface, from the lease.
raw-window-handle.workspace = true
# Keysyms for the keys the host already translated (WebKit takes keysyms, not W3C names).
xkbcommon.workspace = true
# GObject subclasses of WPEDisplay, WPEView and WPEToplevel (the WPE Platform API).
glib = "0.22"
libc = "0.2"

[build-dependencies]
pkg-config = "0.3"
