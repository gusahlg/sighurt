name: Ports

# The terminal-only `sig` on macOS and Windows (docs/rewrite/PORTING.md): no window, no Servo,
# no WPE WebKit, Ladybird or NetSurf (Linux only). Each job builds and tests only the
# terminal-only feature sets. A later step runs when an earlier one failed, so one run shows
# every failure; a newer push to the same branch cancels the run before it.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ports-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  macos:
    name: macOS (terminal only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # The compiler of nix/nixpkgs.nix and of the workspace's rust-version, as in ci.yml.
      # sig's own pages (sighurt-pages) are built for wasm32 by a nested cargo.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      # The Wasm engine's video (ffmpeg-next 8.1) finds FFmpeg with pkg-config. Homebrew's
      # `ffmpeg` is newer than the FFmpeg that version binds (fields and codec ids it names are
      # gone), so the 7 series, which Homebrew keeps apart from its prefix. Its version keys
      # the cache: a cached build script's output names the Cellar directory of the FFmpeg it
      # found, and a newer bottle replaces that directory (run 43846407347).
      - name: Install FFmpeg
        run: |
          brew install ffmpeg@7 pkgconf
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg@7)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "FFMPEG_VERSION=$(brew list --versions ffmpeg@7 | cut -d' ' -f2)" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ffmpeg-${{ env.FFMPEG_VERSION }}

      # The unit tests and tests/tui.rs (sig --tui and --dump in a pty against the demo
      # engine); not the examples, which are the window's.
      - name: Test sig (terminal, demo engine)
        run: >
          cargo test --locked -p sighurt-browser --no-default-features
          --features frontend-tui,engine-demo --bins --tests --no-fail-fast

      # Not the chromes' and renderers' tests: their golden images are drawn with Linux's fonts.
      - name: Test the platform-neutral crates and the terminal frontend
        if: ${{ !cancelled() }}
        run: >
          cargo test --locked -p sighurt-api -p sighurt-core -p sighurt-runtime
          -p sighurt-config -p sighurt-config-example -p sighurt-semantic
          -p sighurt-tui --features sighurt-tui/engine-demo --no-fail-fast

      # tests/tui.rs again with the Wasm engine: sig's own pages (sig://help, home's links to
      # it) and the terminal pages' programs (sig://terminal's shell, sig://config's editor).
      - name: Test sig (terminal, demo and Wasm engines)
        if: ${{ !cancelled() }}
        run: >
          cargo test --locked -p sighurt-browser --no-default-features
          --features frontend-tui,engine-demo,engine-wasm --test tui --no-fail-fast

      # The master side of the terminal pages' pty (the runtime's side, starting and ending the
      # programs, is in the crates' tests above).
      - name: Test the Wasm engine's terminal
        if: ${{ !cancelled() }}
        run: cargo test --locked -p sighurt-engine-wasm --lib pty --no-fail-fast

      # The wgpu renderer against the CPU one (render/sighurt-render-wgpu/tests/compare.rs and
      # cost.rs) on Metal: the runner's Apple Paravirtual device (run 44066514925).
      - name: Test the wgpu renderer against the CPU one
        if: ${{ !cancelled() }}
        run: cargo test --locked -p sighurt-render-wgpu --no-fail-fast -- --nocapture

  windows:
    name: Windows (terminal only)
    runs-on: windows-latest
    steps:
      # The tests' golden files are compared byte for byte: no CRLF on checkout.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # aws-lc-sys (rustls' provider in sig) assembles with NASM on x86_64 Windows.
      - uses: ilammy/setup-nasm@v1

      # sig's own pages (sighurt-pages) are built for wasm32 by a nested cargo.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # The unit tests, and tests/console.rs: sig --tui in a pseudoconsole (ConPTY) and
      # sig --dump into a pipe, printing what the console showed.
      - name: Test sig (terminal, demo engine)
        run: >
          cargo test --locked -p sighurt-browser --no-default-features
          --features frontend-tui,engine-demo --bins --tests --no-fail-fast -- --nocapture

      - name: Test the platform-neutral crates and the terminal frontend
        if: ${{ !cancelled() }}
        run: >
          cargo test --locked -p sighurt-api -p sighurt-core -p sighurt-runtime
          -p sighurt-config -p sighurt-config-example -p sighurt-semantic
          -p sighurt-tui --features sighurt-tui/engine-demo --no-fail-fast

      # The Wasm engine (no FFmpeg here: video refuses, video_none.rs), and with it sig's own
      # pages: its unit tests (guests run under Wasmtime), and sig built with it.
      - name: Test the Wasm engine
        if: ${{ !cancelled() }}
        run: cargo test --locked -p sighurt-engine-wasm --lib --no-fail-fast

      - name: Test sig (terminal, demo and Wasm engines)
        if: ${{ !cancelled() }}
        run: >
          cargo test --locked -p sighurt-browser --no-default-features
          --features frontend-tui,engine-demo,engine-wasm --bins --tests --no-fail-fast
          -- --nocapture

      # The wgpu renderer against the CPU one on DX12: the runner has only WARP (Microsoft Basic
      # Render Driver), and the comparison's process crashed there with an access violation
      # (run 44066514925, docs/rewrite/PORTING.md); not blocking. On a failure the comparison
      # runs again one test at a time.
      - name: Test the wgpu renderer against the CPU one
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          cargo test --locked -p sighurt-render-wgpu --no-fail-fast -- --nocapture
          if ($LASTEXITCODE -ne 0) {
            echo "== again, one test at a time"
            cargo test --locked -p sighurt-render-wgpu --test compare -- --nocapture --test-threads=1
          }
