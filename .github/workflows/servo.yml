# Checks the Servo engine (sighurt-engine-servo) and `sig` with Servo, which ci.yml leaves out.
# This job's feature set is Servo, Wasm, the demo engine and the line chrome. It leaves out
# WPE WebKit and NetSurf, which need prefixes the runners do not have, and it does not enable
# engine-cef or engine-ladybird: ci.yml's workspace commands compile those crates (they need
# nothing at build time).
#
# HEAVY: this compiles a large part of Servo (the first run takes a long time and a lot of
# disk space; later runs rely on the cache). It therefore only runs when the engine, the crates
# it depends on, or the dependency versions change.
name: Servo engine

on:
  push:
    branches: ["**"]
    paths:
      - "crates/sighurt-api/**"
      - "frontends/sighurt-wayland/**"
      - "engines/sighurt-engine-servo/**"
      - "crates/sighurt-runtime/**"
      - "frontends/sighurt-gui/**"
      - "apps/sighurt-browser/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/servo.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/sighurt-api/**"
      - "frontends/sighurt-wayland/**"
      - "engines/sighurt-engine-servo/**"
      - "crates/sighurt-runtime/**"
      - "frontends/sighurt-gui/**"
      - "apps/sighurt-browser/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/servo.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Clippy sighurt-engine-servo
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Servo's native build dependencies: clang/libclang for bindgen, cmake and python3 for
      # its build scripts, and the graphics/font/windowing development libraries it links.
      # mozjs is fetched as a prebuilt archive, so no SpiderMonkey toolchain is needed. The last
      # three lines are the Wasm engine's, which `sig` links too (as in ci.yml).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang libclang-dev llvm-dev cmake python3 pkg-config m4 \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
            libxkbcommon-dev libx11-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libudev-dev libdbus-1-dev libssl-dev libunwind-dev liblzma-dev \
            libgtk-3-dev libasound2-dev libv4l-dev libxkbcommon-x11-dev \
            libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev

      # The compiler of nix/nixpkgs.nix and of the workspace's rust-version: a newer stable
      # deprecates what this one still needs, and -D warnings then fails the build.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting is checked by ci.yml, since the crate is in the root workspace.
      - name: Clippy
        run: cargo clippy --locked -p sighurt-engine-servo --all-targets -- -D warnings

      # The Servo arm of sig's engine registry is compiled only with `engine-servo`.
      - name: Clippy (sig with Servo, without WPE WebKit)
        run: >
          cargo clippy --locked -p sighurt-browser --no-default-features
          --features engine-servo,engine-wasm,engine-demo,chrome-line
          --all-targets -- -D warnings
