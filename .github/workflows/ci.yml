name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libgtk-3-dev libatk1.0-dev \
            libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libasound2-dev \
            pkg-config libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libv4l-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (sig and sig-wasm)
        run: cargo build

      - name: Test (workspace)
        run: cargo test --workspace

  check-wasm:
    name: Check SDK and examples (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Test SDK
        run: cargo test -p sighurt-sdk

      - name: Check SDK
        run: cargo check -p sighurt-sdk --target wasm32-unknown-unknown

      # Everything that builds for wasm32: the SDK, the guest examples and the zero-dependency
      # protocol crate. The browser crates, the WASM engine and the notes backend are native.
      - name: Check examples (wasm32)
        run: >
          cargo check --target wasm32-unknown-unknown --workspace
          --exclude sighurt-browser
          --exclude sighurt-core
          --exclude sighurt-ui
          --exclude sighurt-engine-wasm
          --exclude fullstack-notes-backend

      - name: Check fullstack-notes backend
        run: cargo check -p fullstack-notes-backend
