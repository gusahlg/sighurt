name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libgtk-3-dev libatk1.0-dev \
            libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libasound2-dev \
            pkg-config libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libv4l-dev libudev-dev \
            libwayland-dev libfontconfig1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      # Everything except Servo, which servo.yml checks, and the engines whose build needs a
      # prefix the runners do not have. WPE WebKit needs nix/build-wpewebkit.sh
      # (docs/rewrite/WPE.md). NetSurf's build.rs compiles the NetSurf 3.11 core and stops
      # without the nix-shell's SIGHURT_NETSURF_* variables (docs/rewrite/NETSURF.md); the crate
      # is also GPL-2.0-only and is never a default feature. CEF and Ladybird dlopen their
      # libraries at run time, so a missing prefix does not stop the build and they stay here.
      # Left out: sighurt-engine-servo, sighurt-engine-wpe, sighurt-engine-netsurf, sig's default
      # features (sighurt-browser is checked below with the demo and Wasm engines and the line
      # chrome), and the experiments that link Servo (m0-coexist, m1-mixed, wpe-coexist,
      # tui-servo, wpe-cpu), and wgpu-subsurface (an experiment that needs a compositor and a
      # GPU). `--workspace` alone would compile Servo and would try to build NetSurf (see
      # CLAUDE.md, "Build commands").
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace without Servo, WPE WebKit and NetSurf)
        run: >
          cargo clippy --workspace
          --exclude sighurt-engine-servo --exclude sighurt-engine-wpe
          --exclude sighurt-engine-netsurf --exclude sighurt-browser
          --exclude m0-coexist --exclude m1-mixed --exclude wpe-coexist
          --exclude tui-servo --exclude wpe-cpu --exclude wgpu-subsurface
          --all-targets -- -D warnings

      - name: Clippy (sig without Servo and WPE WebKit)
        run: >
          cargo clippy -p sighurt-browser -p sighurt-runtime -p sighurt-gui
          --no-default-features
          --features engine-demo,engine-wasm,chrome-line
          --all-targets -- -D warnings

      # The Wasm engine's tests run these example guests (engines/sighurt-engine-wasm/tests/).
      - name: Build the example guests the Wasm engine's tests run
        run: >
          cargo build --target wasm32-unknown-unknown --release
          -p hello-sighurt -p raf-demo -p gradient-demo -p typography-demo

      - name: Test (workspace without Servo, WPE WebKit and NetSurf)
        run: >
          cargo test --workspace
          --exclude sighurt-engine-servo --exclude sighurt-engine-wpe
          --exclude sighurt-engine-netsurf --exclude sighurt-browser
          --exclude m0-coexist --exclude m1-mixed --exclude wpe-coexist
          --exclude tui-servo --exclude wpe-cpu --exclude wgpu-subsurface

      # Unit tests only: the end-to-end tests (apps/sighurt-browser/tests/headless.sh and engines.sh)
      # need a compositor and run on a developer machine.
      - name: Test (sig without Servo and WPE WebKit)
        run: >
          cargo test -p sighurt-browser -p sighurt-runtime -p sighurt-gui
          --no-default-features
          --features engine-demo,engine-wasm,chrome-line

  check-wasm:
    name: Check SDK and examples (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Test SDK
        run: cargo test -p sighurt-sdk

      - name: Check SDK
        run: cargo check -p sighurt-sdk --target wasm32-unknown-unknown

      # The guest examples (the SDK is checked above; the rest of the workspace is native).
      - name: Check examples (wasm32)
        run: >
          cargo check --target wasm32-unknown-unknown
          -p hello-sighurt -p audio-player -p raf-demo -p timer-demo
          -p fullstack-notes-frontend -p index -p events-demo -p gradient-demo
          -p typography-demo -p sse-demo

      - name: Check fullstack-notes backend
        run: cargo check -p fullstack-notes-backend
