name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libgtk-3-dev libatk1.0-dev \
            libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libasound2-dev \
            pkg-config libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libv4l-dev libudev-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Everything except Servo, which servo.yml checks: `--workspace` alone, or sighurt-browser
      # with its default features, would compile Servo (see CLAUDE.md, "Build commands").
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (workspace without Servo)
        run: >
          cargo clippy --workspace
          --exclude sighurt-engine-servo --exclude sighurt-browser
          --all-targets -- -D warnings

      - name: Clippy (sig without Servo)
        run: >
          cargo clippy -p sighurt-browser --no-default-features --features engine-demo,engine-wasm
          --all-targets -- -D warnings

      - name: Test (workspace without Servo)
        run: cargo test --workspace --exclude sighurt-engine-servo --exclude sighurt-browser

  check-wasm:
    name: Check SDK and examples (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Test SDK
        run: cargo test -p sighurt-sdk

      - name: Check SDK
        run: cargo check -p sighurt-sdk --target wasm32-unknown-unknown

      # The guest examples (the SDK is checked above; the rest of the workspace is native).
      - name: Check examples (wasm32)
        run: >
          cargo check --target wasm32-unknown-unknown
          -p hello-sighurt -p audio-player -p raf-demo -p timer-demo
          -p fullstack-notes-frontend -p index -p events-demo -p gradient-demo
          -p typography-demo -p sse-demo

      - name: Check fullstack-notes backend
        run: cargo check -p fullstack-notes-backend
