name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Bump Version
    runs-on: ubuntu-latest
    env:
      CRATES: >-
        sighurt-browser/Cargo.toml sighurt-core/Cargo.toml sighurt-ui/Cargo.toml
        sighurt-engine-wasm/Cargo.toml sighurt-sdk/Cargo.toml
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute new version
        id: bump
        run: |
          current=$(grep '^version' sighurt-browser/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          IFS='.' read -r major minor patch <<< "$current"

          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new_version="${major}.${minor}.${patch}"
          echo "new_version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          echo "Bumping $current -> $new_version (${{ inputs.bump }})"

      # The browser, the WASM engine and the guest SDK are versioned together.
      - name: Update Cargo.toml versions
        run: |
          version="${{ steps.bump.outputs.new_version }}"
          for f in $CRATES; do
            sed -i "s/^version = \".*\"/version = \"${version}\"/" "$f"
          done

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $CRATES
          git commit -m "release: v${{ steps.bump.outputs.new_version }}"
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin HEAD --tags

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sig-linux-x86_64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sig-macos-aarch64.tar.gz

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libssl-dev libgtk-3-dev libatk1.0-dev \
            libglib2.0-dev libpango1.0-dev libgdk-pixbuf-2.0-dev \
            libasound2-dev \
            pkg-config libavcodec-dev libavformat-dev libavutil-dev libavfilter-dev \
            libavdevice-dev libswscale-dev libswresample-dev \
            libv4l-dev libudev-dev

      # ffmpeg-sys-next falls back to pkg-config for libavutil; runners do not ship FFmpeg.
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install ffmpeg pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # sig-servo is not built here: it is a separate, much heavier workspace.
      - name: Build release binaries (sig and sig-wasm)
        run: cargo build --release -p sighurt-browser -p sighurt-engine-wasm --target ${{ matrix.target }}

      # sig finds sig-wasm next to itself, so they ship together.
      - name: Package
        run: tar -czf ${{ matrix.artifact }} -C target/${{ matrix.target }}/release sig sig-wasm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 1

  release:
    name: Create Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Sighurt ${{ needs.version.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: artifacts/*
