[package]
name = "sighurt-gui"
description = "Sighurt's Wayland frontend: the owner loop, the chrome and engine presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# Each engine feature enables that engine's runtime in sighurt-runtime (its configuration and
# the registry variant) and the crate that constructs the runtime bound to Wayland targets.
engine-servo = ["sighurt-runtime/engine-servo", "dep:sighurt-engine-servo"]
engine-wasm = ["sighurt-runtime/engine-wasm", "dep:sighurt-engine-wasm"]
engine-wpe = ["sighurt-runtime/engine-wpe", "dep:sighurt-engine-wpe"]
engine-demo = ["sighurt-runtime/engine-demo", "dep:sighurt-engine-demo"]
# Keymaps besides the core's own `bindings`, chosen by `[input] keymap`.
keymap-modal = ["sighurt-runtime/keymap-modal"]
# Chromes besides sighurt-ui's `standard`, chosen by `[ui] chrome`.
chrome-line = ["dep:sighurt-chrome-line"]

[dependencies]
sighurt-api = { path = "../sighurt-api" }
sighurt-core = { path = "../sighurt-core" }
sighurt-wayland = { path = "../sighurt-wayland" }
sighurt-ui = { path = "../sighurt-ui" }
sighurt-runtime = { path = "../sighurt-runtime" }
sighurt-engine-servo = { path = "../sighurt-engine-servo", optional = true }
sighurt-engine-wasm = { path = "../sighurt-engine-wasm", optional = true }
sighurt-engine-wpe = { path = "../sighurt-engine-wpe", optional = true }
sighurt-engine-demo = { path = "../sighurt-engine-demo", optional = true }
sighurt-chrome-line = { path = "../sighurt-chrome-line", optional = true }
# The owner loop.
calloop.workspace = true
# The signal pipe.
rustix.workspace = true
libc = "0.2"
log = "0.4"
