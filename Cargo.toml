[workspace]
members = [
    # The browser (see sighurt-rewrite-plan.md §5 for what each crate owns).
    "crates/sighurt-api",
    "crates/sighurt-core",
    "frontends/sighurt-wayland",
    "ui/sighurt-ui",
    # The render framework: scenes, text, the Backend trait and its CPU backend
    # (docs/rewrite/RENDER.md).
    "render/sighurt-render",
    # The wgpu backend (Vulkan only).
    "render/sighurt-render-wgpu",
    # The Vulkan backend on ash (opt-in).
    "render/sighurt-render-vulkan",
    "apps/sighurt-browser",
    # The terminal frontend (docs/rewrite/TUI.md).
    "frontends/sighurt-tui",
    "crates/sighurt-runtime",
    "frontends/sighurt-gui",
    # Chromes besides the standard one, compiled into `sig` through sighurt-browser's features.
    "extensions/sighurt-chrome-line",
    # DOM extraction shared by the Servo and WPE adapters (docs/rewrite/TUI.md §3).
    "engines/sighurt-semantic",
    # Engines, compiled into `sig` through sighurt-browser's features.
    "engines/sighurt-engine-servo",
    "engines/sighurt-engine-wasm",
    "engines/sighurt-engine-demo",
    # NetSurf (docs/rewrite/NETSURF.md). GPL-2.0-only, and never one of sig's default features.
    "engines/sighurt-engine-netsurf",
    # Needs the WPE WebKit prefix of nix/build-wpewebkit.sh (docs/rewrite/WPE.md).
    "engines/sighurt-engine-wpe",
    # Needs the shim of nix/build-ladybird-shim.sh to run, not to build (docs/rewrite/LADYBIRD.md).
    "engines/sighurt-engine-ladybird",
    # Needs the CEF prefix of nix/build-cef.sh to run, not to build (docs/rewrite/CEF.md).
    "engines/sighurt-engine-cef",
    # Keymaps, compiled into `sig` through sighurt-browser's features.
    "extensions/sighurt-config-example",
    # Guest SDK and example guests.
    "sdk/sighurt-sdk",
    "examples/hello-sighurt",
    "examples/audio-player",
    "examples/raf-demo",
    "examples/timer-demo",
    "examples/fullstack-notes/frontend",
    "examples/fullstack-notes/backend",
    "examples/index",
    "examples/events-demo",
    "examples/gradient-demo",
    "examples/typography-demo",
    "examples/sse-demo",
    # sig's internal pages, Wasm guests (docs/rewrite/pages-2026-11-05.md).
    "pages/sig-page-config",
    # M0: Servo and Wasmtime initialized and used in one process (docs/rewrite/M0.md).
    "experiments/m0-coexist",
    # M1: CPU chrome and a Servo page in one Wayland window (docs/rewrite/M1.md).
    "experiments/m1-mixed",
    # WPE WebKit beside Servo and Wasmtime in one process (docs/rewrite/WPE.md).
    "experiments/wpe-coexist",
    # The terminal frontend's risk-killing prototypes (docs/rewrite/TUI.md §8, phase 0).
    "experiments/tui-servo",
    "experiments/wpe-cpu",
    "experiments/tty-io",
    # wgpu 30 on Vulkan presenting into a host GL-mode subsurface (docs/rewrite/RENDER.md §14).
    "experiments/wgpu-subsurface",
]
# Resolver 3 picks dependency versions that support `rust-version` below: the Rust of the nixpkgs
# pin in nix/nixpkgs.nix, which both machines build with.
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-or-later"
# Sighurt is a fork of Oxide by Nikhil Ranjan (https://github.com/niklabh/oxide); see NOTICE.
authors = ["Nikhil Ranjan <niklabh>", "The Sighurt contributors"]

# Shared third-party versions. These resolve together in one dependency graph. Cargo.lock was
# reseeded from Servo 0.7.0's published lockfile so Servo's dependencies stay at the versions
# that release was tested with. Don't run a broad `cargo update`.
[workspace.dependencies]
# `webgl`, `webcrypto` and `brotli-compression-stream` are optional and off by default in
# 0.7 (0.5 compiled them unconditionally). Without `webcrypto`, `window.crypto` is absent.
# The `multiprocess` feature is on by default and only compiles the IPC path;
# `Opts.multiprocess` stays false, so pages stay in this process.
servo = { version = "0.7", features = ["webgl", "webcrypto", "brotli-compression-stream"] }
surfman = "0.14"
wasmtime = "36"
wayland-client = { version = "0.31", features = ["system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
smithay-client-toolkit = "0.20"
calloop = "0.14"
# The version smithay-client-toolkit 0.20 uses, so there is one binding of libxkbcommon.
xkbcommon = "0.8"
# Pipes and clocks for the Wayland host; already in the graph through smithay-client-toolkit.
rustix = { version = "1", features = ["pipe", "time"] }
# `swash` rasterizes glyphs (SwashCache, Buffer::draw), which the chrome painter needs.
cosmic-text = { version = "0.14", default-features = false, features = ["std", "swash", "fontconfig"] }
tiny-skia = "0.11"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "1.1.2"
tracing = "0.1"
url = "2"

# Dependencies are optimized in debug builds too: unoptimized, Servo is slow enough that heavy
# sites look broken. Without debug info, linking Servo stays tolerable. These are also the
# settings the Servo artifacts already in target/ were built with, so they are reused. Sighurt's
# own crates stay unoptimized, with debug info, and rebuild quickly.
[profile.dev.package."*"]
opt-level = 3
debug = false

# surfman 0.14.0 with one change: context creation does not mutate the process
# environment. See third_party/surfman/SIGHURT-PATCH.md.
# servo-net 0.7.0 with crash-safe cookie and HSTS commits. See
# third_party/servo-net/SIGHURT-PATCH.md.
[patch.crates-io]
surfman = { path = "third_party/surfman" }
servo-net = { path = "third_party/servo-net" }
servo-script = { path = "third_party/servo-script" }
